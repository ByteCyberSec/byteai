[package]
name = "apex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "byteai"
path = "src/main.rs"

[dependencies]
apex-types = { workspace = true }
apex-provider = { workspace = true }
apex-tools = { workspace = true }
apex-core = { workspace = true }
apex-lsp = { path = "../apex-lsp" }
apex-dap = { path = "../apex-dap" }
apex-memory = { path = "../apex-memory" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies.ratatui]
version = "0.29"
optional = true

[dependencies.crossterm]
version = "0.28"
optional = true
